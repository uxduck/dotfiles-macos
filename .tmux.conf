# reload with `tmux source-file ~/.tmux.conf`
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
set -g display-time 500
set -g prefix C-Space
set -g prefix2 F11
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g set-clipboard on
set-window-option -g mode-keys vi
bind c copy-mode
# Copy to system clipboard via OSC 52 (works locally and over SSH).
# Stays in copy mode so scroll position is preserved.
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
set-option -g repeat-time 1000

# Quality of life
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty:extkeys'
set -as terminal-features 'xterm-ghostty:hyperlinks'
set -as terminal-features 'xterm-ghostty:RGB'
set -g allow-rename on
setw -g automatic-rename on

# Ctrl + K to clear tmux scrollback buffer
bind-key -n C-k send-keys -R \; clear-history

bind-key S command-prompt -p "session:" "new-session -A -s '%%'"

# --- Theme -----------------------------------------------------------
# Local = blue & gold, SSH = warm terracotta. The two palettes live in
# ~/.tmux/theme-local.conf and ~/.tmux/theme-remote.conf.
#
# Don't use %if here: it's a parse-time conditional, evaluated ONCE when the
# config is sourced against the server's global env, so it can't give the
# local and SSH sessions different themes on a long-lived server. Instead we
# re-pick the theme on every attach via a hook, keyed on SSH_CONNECTION
# (which tmux tracks per-session and refreshes on attach — unlike SSH_TTY,
# which isn't in update-environment and so is never visible to tmux).
# client-attached doesn't fire when `new-session -A` has to *create* the session,
# so also hook session creation and switching.
set-hook -g client-attached 'if-shell -F "#{SSH_CONNECTION}" "source-file ~/.tmux/theme-remote.conf" "source-file ~/.tmux/theme-local.conf"'
set-hook -g session-created 'if-shell -F "#{SSH_CONNECTION}" "source-file ~/.tmux/theme-remote.conf" "source-file ~/.tmux/theme-local.conf"'
set-hook -g client-session-changed 'if-shell -F "#{SSH_CONNECTION}" "source-file ~/.tmux/theme-remote.conf" "source-file ~/.tmux/theme-local.conf"'

# Apply immediately for the current client too (covers reload via prefix-r and
# the initial source at server start).
if-shell -F "#{SSH_CONNECTION}" "source-file ~/.tmux/theme-remote.conf" "source-file ~/.tmux/theme-local.conf"

# Pane styles
set -g window-style "bg=default,fg=default"
set -g window-active-style "bg=default,fg=default"

# --- F12: toggle outer tmux keybinds for nested sessions -------------
# Press F12 to disable the outer tmux (keys pass through to inner).
# Press F12 again to re-enable. Status bar dims to gray while off.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set mouse off \;\
  set status-style "bg=#3a3a3a,fg=#888888" \;\
  set status-left "#[bg=#888888,fg=#3a3a3a,bold]  OFF #[bg=#3a3a3a,fg=#888888]" \;\
  set status-right "" \;\
  set window-status-current-format "#[fg=#3a3a3a,bg=#555555]#[bg=#555555,fg=#888888]  #I: #W #[fg=#555555,bg=#3a3a3a]" \;\
  set window-status-format "#[fg=#3a3a3a,bg=#444444]#[bg=#444444,fg=#777777]  #I: #W #[fg=#444444,bg=#3a3a3a]" \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u mouse \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u status-right \;\
  set -u window-status-current-format \;\
  set -u window-status-format \;\
  refresh-client -S

# Toggle last window
bind Tab last-window

# New window in the same folder as the active pane
bind n new-window -c "#{pane_current_path}"

# Split panes in the same folder as the active pane
bind \\ split-window -h -c "#{pane_current_path}"
# Split panes and launch claude
bind \| split-window -h -c "#{pane_current_path}" \; send-keys 'claude' Enter
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}" \; send-keys 'claude' Enter
# Split panes and launch opencode
bind = split-window -v -c "#{pane_current_path}" \; send-keys 'opencode' Enter
bind + split-window -h -c "#{pane_current_path}" \; send-keys 'opencode' Enter

# Navigate windows with Alt+[ and Alt+] (no prefix)
bind -n M-[ previous-window
bind -n M-] next-window

# Resize panes with vi-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Override tmux-sensible's reattach-to-user-namespace (not needed on modern macOS)
set -g default-command "${SHELL}"

# --- Resilience: never let a rogue/tiny client squash the window --------
# A 1-row client (e.g. an accidental "ssh <thishost>" that re-attaches this
# session inside one of its own panes) used to collapse the whole window to
# one line ("infinite scroll, cant see typing"). "largest" keeps the window
# sized to the biggest attached client so a tiny mirror cannot trap you.
set -g window-size largest
